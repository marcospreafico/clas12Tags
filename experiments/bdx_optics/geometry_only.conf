# Geometry comparison reference, room-temperature BGO. See reference/bdx_optics/README.md.
light_yield_per_MeV=8500
refractive_index=2.15
decay_time_ns=300
# Narrow peak proxy; transport coefficients are wavelength independent.
wavelength_nm=480
# BGO bulk absorption length supplied by the user, 24 November 2026: 10 m.
# Constant over the proxy emission spectrum. Set 0 explicitly to disable it.
absorption_length_mm=10000
# White paint properties supplied by the user, 23 November 2026.
# Absolute reflection probability at EVERY encounter, independent of angular mixture.
wrap_reflectivity=0.98
wrap_model=paint
# Axial distance from the +z large base: Lambertian / linear mixture / specular.
# These lengths must sum to the 240 mm physical crystal length.
diffuse_length_mm=40
transition_length_mm=100
specular_length_mm=100
cherenkov=0
# Numerical relocation inside the same solid after reflection (1 nm), no physical loss.
boundary_push_mm=0.000001
